# Fabrique l'appli sur un Mac de GitHub, la met à l'épreuve (les tests du jeu,
# une partie jouée dans le vrai panneau, la mise à jour posée en vrai dans
# /Applications), et garde le résultat en pièce jointe de chaque passage.
# Sur une étiquette vX.Y.Z (posée par scripts/Publier.ps1) : publie la version.
name: Fabriquer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabriquer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: La machine
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Les tests du jeu
        run: swift test

      - name: Fabriquer l'appli
        run: bash scripts/construire-app.sh

      - name: Planches et partie scriptée
        run: bash scripts/autotest.sh

      - name: Épreuve de la mise à jour
        run: bash scripts/epreuve-maj.sh

      - name: Photos de la notice (en dernier, change la langue du Mac)
        continue-on-error: true
        run: bash scripts/captures-notice.sh

      - name: Garder les fichiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mot-du-jour-${{ github.run_number }}
          path: sortie/
          if-no-files-found: warn

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          MAJ_CLE_PRIVEE: ${{ secrets.MAJ_CLE_PRIVEE }}
        run: bash scripts/publier-release.sh "$GITHUB_REF_NAME"
